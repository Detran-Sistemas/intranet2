port: $(PORT:3000)
bindIP: 0.0.0.0
db:
  type: $(DB_TYPE:sqlite)
  host: '$(DB_HOST:localhost)'
  port: $(DB_PORT:5432)
  user: '$(DB_USER:wikijs)'
  pass: '$(DB_PASS:wikijsrocks)'
  db: $(DB_NAME:wiki)
  storage: $(DB_FILEPATH:./data/wiki.sqlite)
  ssl: $(DB_SSL:false)
ssl:
  enabled: $(SSL_ACTIVE:false)
  port: 3443
  provider: letsencrypt
  domain: $(LETSENCRYPT_DOMAIN:)
  subscriberEmail: $(LETSENCRYPT_EMAIL:)
logLevel: $(LOG_LEVEL:info)
logFormat: $(LOG_FORMAT:default)
ha: $(HA_ACTIVE:false)
dataPath: $(DATA_PATH:./data)
bodyParserLimit: $(BODY_PARSER_LIMIT:5mb)
